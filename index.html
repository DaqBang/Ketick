<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b1f">
  <title>Kawal ERP</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kawal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Jika CDN gagal dimuat (offline), jangan rosakkan app
    if (window.tailwind) tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef5ff', 100: '#d9e8ff', 200: '#bcd6ff', 300: '#8ebcff', 400: '#5a97fb',
              500: '#3b76f6', 600: '#2558eb', 700: '#1d45d8', 800: '#1e3aaf', 900: '#1e3489', 950: '#0b1533',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="font-sans text-slate-900 antialiased">
  <div id="app"></div>
  <script>
    // Papar ralat di skrin (bukan skrin kosong) supaya mudah dikesan dari phone
    function showBootError(msg) {
      var el = document.getElementById('boot-error') || document.createElement('div');
      el.id = 'boot-error';
      el.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:9999;background:#fff;color:#b91c1c;' +
        'padding:14px;border-radius:14px;font:13px/1.4 monospace;white-space:pre-wrap;box-shadow:0 10px 30px rgba(0,0,0,.5)';
      el.textContent = 'Ralat memuat app:\n' + msg +
        '\n\nCuba: tarik untuk refresh / buka tab inkognito. Jika masih, hantar mesej ini.';
      document.body.appendChild(el);
    }
    window.addEventListener('error', function (e) {
      showBootError((e.message || 'ralat') + (e.filename ? '\n@ ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showBootError(String(e.reason && (e.reason.stack || e.reason)));
    });
  </script>
  <script type="module" src="js/app.js"
    onerror="showBootError('Gagal muat salah satu fail JS (404?). Semak semua fail dalam folder js/ sudah di-push.')"></script>

  <!-- PWA: service worker, butang pasang, penanda offline -->
  <button id="install-btn" hidden
    style="position:fixed;right:14px;bottom:14px;z-index:60;padding:10px 16px;border-radius:9999px;border:1px solid rgba(255,255,255,.3);
    color:#fff;font:600 13px 'Plus Jakarta Sans',system-ui;background:linear-gradient(180deg,#4f86ff,#2558eb);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -8px rgba(37,88,235,.9)">⬇ Pasang app</button>
  <div id="offline-bar" hidden
    style="position:fixed;top:0;left:0;right:0;z-index:70;text-align:center;padding:6px;font:600 12px system-ui;
    color:#0b1533;background:#fbbf24">Offline — app masih berfungsi, data disimpan dalam peranti ini</div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW gagal', e); });
      });
    }
    var installEvt = null;
    var installBtn = document.getElementById('install-btn');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      installEvt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', function () {
      if (!installEvt) return;
      installEvt.prompt();
      installEvt.userChoice.finally(function () { installEvt = null; installBtn.hidden = true; });
    });
    window.addEventListener('appinstalled', function () { installBtn.hidden = true; });
    var offBar = document.getElementById('offline-bar');
    function net() { offBar.hidden = navigator.onLine; }
    window.addEventListener('online', net);
    window.addEventListener('offline', net);
    net();
  </script>
</body>
</html>
